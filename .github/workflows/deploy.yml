name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.PUBLIC_RECAPTCHA_SITE_KEY }}

      # Ships only the *built* dist/ output (plain HTML/CSS/JS) into
      # public_html — never the source repo itself. No --delete: existing
      # files in public_html that aren't part of this build are left alone.
      - name: Upload dist/ to public_html via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr
          path: dist/
          remote_path: ${{ secrets.CPANEL_PUBLIC_HTML_PATH }}
          remote_host: ${{ secrets.CPANEL_SSH_HOST }}
          remote_port: ${{ secrets.CPANEL_SSH_PORT }}
          remote_user: ${{ secrets.CPANEL_SSH_USER }}
          remote_key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
